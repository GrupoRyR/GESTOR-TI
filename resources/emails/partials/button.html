<!-- partial: button (bulletproof: colored cell + padded link, 44 px tall) Each template writes its own label where {{ action_label }} is; follow it with the fallback link. -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse: separate; margin: 24px 0 0;">
  <tr>
    <td align="center" bgcolor="{{ brand_color }}" style="background: {{ brand_color }}; border-radius: 10px; mso-padding-alt: 12px 24px;">
      <a class="em-button" href="{{ action_url }}" target="_blank" style="display: inline-block; padding: 12px 24px; font-family: Figtree, 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; line-height: 20px; color: #FFFFFF; text-decoration: none; border-radius: 10px; mso-line-height-rule: exactly;">{{ action_label }}</a>
    </td>
  </tr>
</table>
<p class="em-t3" style="margin: 12px 0 0; font-size: 12px; line-height: 18px; color: #5E6168;">Si el botón no funciona, copia este enlace:<br>
  <a class="em-t2" href="{{ action_url }}" target="_blank" style="color: #45484E; word-break: break-all;">{{ action_url }}</a></p>
