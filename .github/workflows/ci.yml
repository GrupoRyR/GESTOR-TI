name: CI

# Runs only for PRs targeting main and pushes to main: stacked PRs spend no
# minutes until their base is changed to main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new commit cancels the previous run of the same PR; runs on main never
# cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: PHP (Pint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # .env.example leaves it empty and spatie/laravel-backup rejects an
      # empty address while booting. Process env wins over .env in Laravel.
      BACKUP_NOTIFICATION_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, zip, intl, gd, fileinfo, openssl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style
        run: vendor/bin/pint --test

      # SQLite in-memory (phpunit.xml).
      - name: Tests
        run: php artisan test

  frontend:
    name: Front-end (build + types)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
